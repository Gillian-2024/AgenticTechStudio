<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>插入排序：小老鼠排队</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a34;font-family:"PingFang SC","Hiragino Sans GB",sans-serif;color:#26324a}.stage{position:absolute;width:1920px;height:1080px;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;background:radial-gradient(ellipse at 50% 36%,#fffdf2 0%,#f8f2df 65%,#eee4cf 100%);overflow:hidden}.grain{position:absolute;inset:0;opacity:.14;background-image:radial-gradient(#806b49 .7px,transparent .8px);background-size:8px 8px;pointer-events:none}.sun{position:absolute;width:550px;height:550px;border-radius:50%;background:#ffd66a;opacity:.25;top:100px;right:170px}.topline{position:absolute;top:64px;left:92px;right:92px;display:flex;justify-content:space-between;align-items:center;color:#78819a;font-weight:700;letter-spacing:3px;font-size:22px}.brand{color:#e59a44}.headline{position:absolute;top:130px;left:0;width:100%;text-align:center;font-size:82px;font-weight:900;letter-spacing:4px;color:#263451}.headline small{display:block;font-size:28px;letter-spacing:8px;color:#e39b42;margin-top:14px}.scene{position:absolute;top:270px;left:95px;right:95px;height:615px}.row{position:absolute;left:50%;top:240px;transform:translateX(-50%);display:flex;gap:24px;align-items:flex-end}.token{width:225px;position:relative;height:290px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:none}.mouse{width:178px;height:164px;position:relative}.mouse svg{width:100%;height:100%;overflow:visible}.number{position:absolute;top:-22px;z-index:3;width:104px;height:104px;background:#fff;border:6px solid #e7a243;border-radius:27px;box-shadow:0 9px 0 #d89339,0 12px 22px #6f5b2b25;display:grid;place-items:center;font-size:54px;font-weight:900;color:#293653}.token.sorted .number{border-color:#63bc88;box-shadow:0 9px 0 #53a976,0 12px 22px #416d4b20}.token.active{transform:translateY(-38px)}.token.active .number{background:#ffe89c;transform:scale(1.12)}.token.compare .number{border-color:#ea7160}.token.moved{animation:bob .5s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-46px)}}.base{position:absolute;top:705px;left:220px;right:220px;height:20px;border-radius:20px;background:#d8c8a6;box-shadow:0 10px 0 #c2af8c}.ground{position:absolute;bottom:0;height:205px;width:100%;background:linear-gradient(#dce9d4,#cbdcc4)}.grass{position:absolute;bottom:175px;width:100%;height:38px;background:repeating-linear-gradient(110deg,transparent 0 22px,#9dbd91 23px 26px,transparent 27px 45px)}.caption{position:absolute;bottom:60px;left:140px;right:140px;min-height:104px;border-radius:28px;background:#fffdf8;box-shadow:0 10px 0 #eadfc8,0 18px 45px #39435a16;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px 44px;font-size:38px;font-weight:750;color:#293753;z-index:8}.caption:before{content:'旁白';position:absolute;left:28px;top:-17px;padding:7px 20px;border-radius:18px;background:#efa94b;color:white;font-size:18px;letter-spacing:2px}.rule{position:absolute;top:25px;left:50%;transform:translateX(-50%);font-size:31px;font-weight:800;background:#fff8df;border:3px solid #efc46e;border-radius:24px;padding:18px 32px;color:#48516a;white-space:nowrap}.arrow{position:absolute;font-size:72px;color:#ee765d;top:130px;left:calc(50% - 425px);animation:point .7s ease-in-out infinite alternate}@keyframes point{to{transform:translateY(15px)}}.badge{position:absolute;top:175px;left:150px;padding:13px 22px;background:#dff2df;color:#438355;border-radius:18px;font-size:24px;font-weight:800}.check{position:absolute;top:165px;right:180px;color:#54ad75;font-size:72px}.progress{position:absolute;left:0;bottom:0;height:12px;background:#eba84b;z-index:12}.label{position:absolute;top:120px;left:50%;transform:translateX(-50%);font-size:25px;color:#828ba0;letter-spacing:2px;white-space:nowrap}.cards{position:absolute;left:50%;top:350px;transform:translateX(-50%);display:flex;gap:28px}.card{width:142px;height:202px;background:#fff;border-radius:18px;border:3px solid #e9dfcd;box-shadow:0 12px 0 #d9cfbd;display:grid;place-items:center;font-size:78px;font-weight:900;color:#31405f;position:relative}.card.red{color:#e67968}.card:nth-child(2),.card:nth-child(4){transform:rotate(-7deg) translateY(15px)}.card:nth-child(3),.card:nth-child(5){transform:rotate(7deg) translateY(-15px)}.sorted-zone{position:absolute;top:190px;left:90px;width:460px;height:400px;border:4px dashed #7bb68b;border-radius:34px;background:#e9f4e5aa}.zone-title{position:absolute;top:145px;left:190px;color:#55936a;font-size:28px;font-weight:800}.finish{position:absolute;inset:0;background:linear-gradient(135deg,#273957,#536d88);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}.finish h1{font-size:108px;margin:0 0 22px;letter-spacing:7px}.finish p{font-size:38px;color:#ffe39a;margin:0}.finish .stars{font-size:58px;color:#ffd36b;letter-spacing:35px;margin-bottom:44px}.hidden{display:none}
</style></head><body><main class="stage" id="stage"><div class="sun"></div><div class="grain"></div><div class="topline"><span class="brand">🐭 小小算法课</span><span>一分钟学会 · 排序</span></div><h1 class="headline" id="headline">插入排序<small>小老鼠排队</small></h1><div class="scene" id="scene"></div><div class="ground" id="ground"><div class="grass"></div></div><div class="caption" id="caption"></div><div class="progress" id="progress"></div></main><script>
(()=>{const stage=document.querySelector('#stage'),scene=document.querySelector('#scene'),caption=document.querySelector('#caption'),headline=document.querySelector('#headline'),ground=document.querySelector('#ground'),progress=document.querySelector('#progress');let start=performance.now(),autoplay=true,rafId;
const narr=["你打扑克的时候，是怎么理牌的？","一张一张拿起来，插到它该在的位置。电脑里有个算法，就是这么干的。","今天，六只小老鼠举着数字牌，要从矮到高排好队。","规则只有一条：从第二只开始往左看，比左边小，就和左边换位置，直到换不动为止。","2 比 5 小，换！2 到了最前面。","4 比 5 小，换；4 比 2 大，停。","6 比 5 大，不用动。","1 最小，一路换了四次，换到最前面；3 换三次，插到 2 和 4 中间。","排好了！左边永远是排好的队伍，新来的小老鼠只要找到位置插进去。","这就是插入排序。下次理牌的时候，你就是一台电脑。"];
const mouseSVG=`<svg viewBox="0 0 180 160" aria-hidden="true"><path d="M42 112 C10 128 12 150 0 151" fill="none" stroke="#9c7465" stroke-width="6" stroke-linecap="round"/><ellipse cx="90" cy="104" rx="58" ry="48" fill="#b6c3d0"/><circle cx="91" cy="65" r="49" fill="#c6d0d9"/><circle cx="52" cy="28" r="25" fill="#c6d0d9"/><circle cx="52" cy="28" r="15" fill="#ed9fa1"/><circle cx="130" cy="30" r="25" fill="#c6d0d9"/><circle cx="130" cy="30" r="15" fill="#ed9fa1"/><ellipse cx="91" cy="81" rx="23" ry="17" fill="#f5d2c6"/><circle cx="76" cy="60" r="5" fill="#27344d"/><circle cx="107" cy="60" r="5" fill="#27344d"/><ellipse cx="91" cy="77" rx="5" ry="4" fill="#e77f83"/><path d="M83 91 Q91 97 99 91" fill="none" stroke="#8d5960" stroke-width="3" stroke-linecap="round"/><path d="M72 82 L43 78 M73 88 L45 93 M108 82 L137 78 M108 88 L136 93" stroke="#8c98a6" stroke-width="2"/><ellipse cx="69" cy="145" rx="20" ry="8" fill="#d7a07c"/><ellipse cx="111" cy="145" rx="20" ry="8" fill="#d7a07c"/></svg>`;
function fit(){let s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.setProperty('--scale',s)}addEventListener('resize',fit);fit();
function cardRow(nums,opts={}){let row=document.createElement('div');row.className='row';nums.forEach((n,i)=>{let t=document.createElement('div');t.className='token'+(opts.sorted?' sorted':'')+(i===opts.active?' active':'')+(i===opts.compare?' compare':'');t.innerHTML=`<div class="number">${n}</div><div class="mouse">${mouseSVG}</div>`;row.append(t)});scene.append(row);scene.insertAdjacentHTML('beforeend','<div class="base"></div>')}
function draw(t){t=Math.max(0,Math.min(60,Number(t)||0));scene.innerHTML='';caption.textContent=narr[([6,12,18,26,32,38,42,50,56,60].findIndex(x=>t<x)+10)%10];ground.classList.remove('hidden');headline.classList.remove('hidden');
if(t<6){headline.classList.remove('hidden');scene.insertAdjacentHTML('beforeend',`<div class="label">把手里的牌理整齐吧</div><div class="cards"><div class="card red">5</div><div class="card">2</div><div class="card red">4</div><div class="card">6</div><div class="card red">1</div><div class="card">3</div></div>`)}
else if(t<12){headline.classList.add('hidden');scene.insertAdjacentHTML('beforeend',`<div class="label">拿起一张 → 找位置 → 插进去</div><div class="cards"><div class="card">2</div><div class="card">4</div><div class="card red">5</div><div class="card">6</div><div class="card red">1</div><div class="card">3</div></div><div class="arrow" style="left:73%;top:440px">↓</div>`)}
else if(t<18){headline.classList.add('hidden');cardRow([5,2,4,6,1,3])}
else if(t<26){headline.classList.add('hidden');scene.insertAdjacentHTML('beforeend','<div class="rule">从第二只开始：比左边小，就向左交换</div><div class="arrow">↓</div>');cardRow([5,2,4,6,1,3],{active:1,compare:0})}
else if(t<32){headline.classList.add('hidden');cardRow(t<29?[5,2,4,6,1,3]:[2,5,4,6,1,3],{active:t<29?1:0,compare:t<29?0:-1});scene.insertAdjacentHTML('beforeend',`<div class="badge">${t<29?'2 ＜ 5　交换！':'✓ 2 到了最前面'}</div><div class="arrow" style="left:${t<29?'43%':'30%'}">${t<29?'↔':'✨'}</div>`)}
else if(t<38){headline.classList.add('hidden');cardRow(t<35?[2,5,4,6,1,3]:[2,4,5,6,1,3],{active:t<35?2:1,compare:t<35?1:-1});scene.insertAdjacentHTML('beforeend',`<div class="badge">${t<35?'4 ＜ 5　交换！':'4 ＞ 2　停在这里'}</div>`)}
else if(t<42){headline.classList.add('hidden');cardRow([2,4,5,6,1,3],{active:3,sorted:true});scene.insertAdjacentHTML('beforeend','<div class="check">✓</div><div class="badge">6 ＞ 5　不用动</div>')}
else if(t<50){headline.classList.add('hidden');let nums=t<46?[2,4,5,6,1,3]:t<48?[1,2,4,5,6,3]:[1,2,4,5,6,3];if(t>=48) nums=[1,2,3,4,5,6];cardRow(nums,{active:t<46?4:(t<48?0:2),sorted:t>=48});scene.insertAdjacentHTML('beforeend',`<div class="badge">${t<46?'1 连换四次':t<48?'1 到最前面':'3 连换三次，插入完成'}</div>`)}
else if(t<56){headline.classList.add('hidden');scene.insertAdjacentHTML('beforeend','<div class="sorted-zone"></div><div class="zone-title">已排好</div>');cardRow([1,2,3,4,5,6],{sorted:true})}
else{headline.classList.add('hidden');ground.classList.add('hidden');scene.innerHTML='<div class="finish"><div class="stars">✦ ✦ ✦</div><h1>插入排序</h1><p>下次理牌，你就是一台电脑！</p></div>'}
progress.style.width=(t/60*100)+'%';}
window.seek=t=>{autoplay=false;if(rafId!==undefined)cancelAnimationFrame(rafId);draw(t)};function tick(now){if(!autoplay)return;draw((now-start)/1000);if((now-start)/1000<60)rafId=requestAnimationFrame(tick)}rafId=requestAnimationFrame(tick);})();</script></body></html>
